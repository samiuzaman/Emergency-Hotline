<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency-Hotline</title>
    <!-- Link External CSS File -->
     <link rel="stylesheet" href="style.css">
     <!-- Link Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Inter Font CDN Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
     <!-- Font Awesome CDN Link -->
     <script src="https://kit.fontawesome.com/27daea0603.js" crossorigin="anonymous"></script>

     <style type="text/tailwindcss">
      @theme {
        --color-greenColor: #00A63E;
        --color-darkColor: #111111;
        --color-grayColor: #5C5C5C;
        --color-logoText: rgba(0, 103, 71, 1);
        --color-lightGreen: rgba(65, 255, 107, 0.2);
        --color-borderColor: rgba(212, 214, 213, 1);
        /* --color-bannerBg: "bg-gradient-to-r from-[#013223] via-[#006747] to-[#013223]"; */
        --font-primaryFont: Inter;
      }
    </style>
</head>
<body class="font-primaryFont">
    <header>
      <nav class="w-11/12 2xl:w-10/12 mx-auto py-5 flex flex-col lg:flex-row gap-6 justify-between items-center">
        <div class="flex justify-center items-center gap-3">
          <img class="w-12 h-12" src="/assets/logo.png" alt="logo image">
          <h6 class="text-lg font-semibold text-logoText leading-6">Emergency <br/> Hotline</h6>
        </div>
        <!-- heart, coin & copy button -->
        <div class="flex items-center gap-4">
          <!-- Heart div -->
          <div class="flex justify-center items-center gap-2 bg-lightGreen px-5 py-2 rounded-full">
            <span class="text-md font-semibold text-darkColor">0</span>
            <img class="w-6 h-6" src="/assets/heart.png" alt="">
          </div>
          <!-- Coin Div -->
          <div class="flex justify-center items-center gap-2 bg-lightGreen px-5 py-2 rounded-full">
            <span class="text-md font-semibold text-darkColor">100</span>
            <img class="w-6 h-6" src="/assets/coin.png" alt="">
          </div>
          <!-- Copy Div -->
           <div class="flex justify-center items-center gap-2 bg-greenColor px-5 py-2 rounded-full">
            <p class="text-base font-medium text-white "><span>2</span> Copy</p>
          </div>
        </div>
      </nav>
      <!-- banner section -->
      <section class="bg-gradient-to-r from-[#013223] via-[#006747] to-[#013223] py-8 flex flex-col items-center space-y-4">
        <img class="w-24 h-24" src="/assets/logo-dark.png" alt="">
        <h1 class="text-2xl lg:text-4xl text-white font-bold">Emergency Service Directory</h1>
        <p class="text-base text-white">Government Emergency Services at Your Fingertip – A Project by  Government of the People’s Republic of Bangladesh</p>
      </section>
    </header>
    <main class="bg-lightGreen pt-6 pb-12">
      <section class="w-11/12 2xl:w-10/12 mx-auto flex flex-col lg:flex-row gap-6">
        <!-- Card Container -->
        Left Side Sercice Card
        <!-- Right Side history Section -->
        <aside class="w-4/12 bg-white p-5 rounded-xl shadow-md">
         Right Side
      </aside>
      </section>
    </main>
    <script src="/script.js"></script>
</body>
</html>
